name: build

# Per-distro CI: each job builds natively on its own distro so the
# tarball + native package it uploads actually match that distro's
# toolchain, glibc and Qt. Add a new distro by copying one job block.
#
# Triggers:
#   - every push to main and every PR (build + upload as Actions artifacts)
#   - every version tag (build + attach to the GitHub Release)
#   - manual "Run workflow" button
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

# Version is read from packaging/dlssnr.spec (Version: + %global pkg_release),
# so tagging v0.2.5-5 builds dlssnr-0.2.5-5-*.tar.gz / .rpm / .deb.
# The personal variant is staged on every run, but it only contains NGX DLLs
# if binaries/*.dll exist in the checkout -- public CI runners never have
# them, so the uploaded -personal files are DLL-less placeholders unless you
# inject the DLLs (e.g. a private runner or a base64 secret).

jobs:
  # ---- Fedora: tarballs + RPMs -------------------------------------------
  fedora:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          dnf install -y \
            gcc gcc-c++ clang make \
            glibc-devel kernel-headers libstdc++-devel \
            libX11-devel libXi-devel libXext-devel libXrandr-devel \
            mingw64-gcc-c++ \
            qt6-qtbase-devel \
            rpm-build \
            pciutils \
            pkgconf-pkg-config \
            glibc-devel.i686 libstdc++-devel.i686 \
            git-core bash tar gzip

      - name: Build + package (tarballs + RPMs)
        env:
          DLSSNR_SKIP_MANIFEST_INSTALL: "1"
        run: ./build.sh --dist

      - name: Smoke-check RPM contents
        run: |
          ls -l dist/
          rpm -qlp dist/dlssnr-*.x86_64.rpm | head -30

      - name: Suffix tarballs per distro (avoid Release filename collisions)
        run: |
          for f in dist/dlssnr-*-linux-x86_64.tar.gz; do
            cp "$f" "${f%-linux-x86_64.tar.gz}-fedora44-x86_64.tar.gz"
          done
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: fedora-packages
          path: |
            dist/*.tar.gz
            dist/*.rpm

  # ---- Ubuntu: tarballs + DEBs -------------------------------------------
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            g++ g++-multilib make \
            g++-mingw-w64-x86-64 \
            qt6-base-dev qt6-base-dev-tools qmake6 \
            clang \
            libx11-dev libxi-dev libxext-dev libxrandr-dev \
            pciutils \
            pkg-config \
            dpkg-dev debhelper \
            git bash tar gzip

      - name: Build (tarballs)
        env:
          DLSSNR_SKIP_MANIFEST_INSTALL: "1"
        run: ./build.sh --tar

      - name: Build .deb packages
        run: ./packaging/make-deb.sh

      - name: Smoke-check DEB contents
        run: |
          ls -l dist/
          dpkg-deb -c dist/dlssnr_*_amd64.deb | head -30
          dpkg-deb -f dist/dlssnr_*_amd64.deb Package Version Architecture Depends

      - name: Suffix tarballs per distro (avoid Release filename collisions)
        run: |
          for f in dist/dlssnr-*-linux-x86_64.tar.gz; do
            cp "$f" "${f%-linux-x86_64.tar.gz}-ubuntu24.04-x86_64.tar.gz"
          done
          ls -l dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-packages
          path: |
            dist/*.tar.gz
            dist/*.deb

  # ---- Attach everything to a GitHub Release on tag push ------------------
  release:
    needs: [fedora, ubuntu]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -lR release-artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
