[binaries]
c = ['clang', '--target=x86_64-w64-windows-gnu']
cpp = ['clang++', '--target=x86_64-w64-windows-gnu']
ar = 'llvm-ar'
strip = 'llvm-strip'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['--target=x86_64-w64-windows-gnu']
cpp_args = ['--target=x86_64-w64-windows-gnu']
cpp_link_args = ['--target=x86_64-w64-windows-gnu', '-static']
