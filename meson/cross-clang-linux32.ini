[binaries]
c = ['clang', '-m32']
cpp = ['clang++', '-m32']
ar = 'llvm-ar'
strip = 'llvm-strip'

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
needs_exe_wrapper = true

[built-in options]
c_args = ['-m32']
cpp_args = ['-m32']
cpp_link_args = ['-m32']
